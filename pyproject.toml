[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-relguard"
version = "0.1.0"
description = "Validate exact-text CSV keys and references locally before importing data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
csv-relguard = "csv_relguard.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/csv-relguard"
Issues = "https://github.com/KanadeK/csv-relguard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]
"examples/*" = ["S603", "S607"]
